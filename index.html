<!DOCTYPE html>
<html>
<head>
    
    <title>Rakhi Celebration 🎀</title>

    <style>
        body {
            background: linear-gradient(135deg, #ffe6f0, #fff5e6);
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            color: #d63384;
            font-size: 40px;
        }

        p {
            color: #555;
            font-size: 18px;
        }
form {
    background: rgba(255, 255, 255, 0.85);
    width: 350px;
    margin: 30px auto;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.8);
}
input {
    width: 90%;
    padding: 12px;
    margin-top: 8px;
    border: 2px solid #f3b6d2;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}
button {
    background: #d63384;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.3s;
}

button:hover {
    background: #b82b6f;
    transform: scale(1.05);
}
label {
    font-weight: bold;
    color: #b82b6f;
    font-size: 16px;
}
.rakhi {
    font-size: 45px;
    margin-bottom: 15px;
}
@media (max-width: 600px) {
    body {
        padding-top: 40px;
    }

    h1 {
        font-size: 30px;
    }

    form {
        width: 75%;
        padding: 25px;
    }
}
#thankYouMessage {
    display: none;
}
    </style>
</head>

<body>
    <div class="rakhi">🪢🎀🪢</div>
    <h1>A Special Rakhi Surprise 🎀</h1>
<p>A little surprise is waiting for you. Fill in your details to continue. 💖</p>
<form action="https://formsubmit.co/vermakaustubh1130@gmail.com" method="POST">

    <label>Your Name:</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Your Email:</label>
    <input type="email" name="email" required>

    <br><br>

    <button type="submit">Request My Surprise 🎁</button>

</form>
<div id="thankYouMessage">
    <div class="rakhi">🎀</div>

    <h2>Thank You! 💖</h2>

    <p>Your request has been received successfully.</p>

    <p>
        A special Rakhi surprise is being prepared just for you. 🎁
    </p>

    <p>
        Keep an eye on your email... 📩✨
    </p>
</div>
</body>
</html>
